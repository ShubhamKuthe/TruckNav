name: trucknav_mobile
description: "TruckNav mobile app for LAN discovery, GPS display, and semantic navigation controls."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  multicast_dns: ^0.3.3+1
  web_socket_channel: ^3.0.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

